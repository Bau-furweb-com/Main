<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add-ons | Kollektiv</title>
  <link href="../css/output.css" rel="stylesheet">

  <script type="module">import "https://cdn.skypack.dev/@hotwired/turbo";</script>
  <style>::-webkit-scrollbar { display: none; } * { scrollbar-width: none; -ms-overflow-style: none; }</style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans h-screen overflow-hidden antialiased flex">

    <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-indigo-200 hidden md:flex transition-all duration-300 z-20 h-full overflow-y-auto flex-col flex-shrink-0">
      <div class="h-20 flex items-center px-6 border-b border-indigo-200">
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Studio<span class="text-indigo-600">Web</span></h1>
      </div>
      <nav class="flex-1 px-4 py-6 space-y-1" id="sidebarNav">
        <a href="/dashboard/index.html" class="block px-4 py-2 text-slate-600 hover:text-indigo-900 hover:bg-indigo-50 rounded-lg font-medium text-sm transition-colors">Start</a>
        <a href="/dashboard/billing.html" class="block px-4 py-2 text-slate-600 hover:text-indigo-900 hover:bg-indigo-50 rounded-lg font-medium text-sm transition-colors">Abrechnung</a>
        <a href="/dashboard/chat.html" class="block px-4 py-2 text-slate-600 hover:text-indigo-900 hover:bg-indigo-50 rounded-lg font-medium text-sm transition-colors">Chat</a>
        <div class="relative mt-5 mb-1 pt-1">
          <a href="#" class="block px-4 py-2 text-slate-600 rounded-lg font-medium text-sm opacity-50 grayscale cursor-not-allowed pointer-events-none flex items-center justify-between">
            <span class="truncate">Add-ons</span>
            <span class="text-[9px] font-bold text-indigo-600 tracking-wider uppercase bg-white px-1.5 py-0.5 rounded-full border border-indigo-200 shadow-sm mt-0.5">Bald</span>
          </a>
        </div>
      </nav>
      <div class="p-4 border-t border-indigo-200">
        <button id="logoutBtn" class="w-full flex items-center justify-center space-x-2 px-4 py-2 bg-white hover:bg-slate-50 border border-indigo-200 text-slate-900 rounded-lg transition-colors text-sm font-medium shadow-sm">
          <span>Abmelden</span>
        </button>
      </div>
    </aside>

  <main class="relative flex-1 overflow-y-auto">
    <!-- Blobs -->
    <div class="blob bg-[#8b5cf6] w-96 h-96 rounded-full top-0 left-0 mix-blend-screen opacity-20"></div>
    <div class="blob bg-pink-500 w-96 h-96 rounded-full bottom-0 right-0 mix-blend-screen opacity-20"></div>
    <header class="bg-indigo-50 border-b border-indigo-200 px-6 py-3 flex items-center justify-between shadow-sm z-10 flex-shrink-0 transition-opacity h-20">
      <div class="flex items-center justify-between w-full">
        <h1 class="text-xl font-bold text-slate-900">Add-ons</h1>
      </div>
    </header>

    <div class="p-8 max-w-7xl mx-auto space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="addonsGrid">
        <!-- Addons injected via JS -->
      </div>
    </div>
  </main>

  <script type="module">
    import { supabase, requireAuth } from '../js/supabase.js';
        import { requestAddon } from '../js/addons.js';

    const addonsList = [
      {
        id: 'analytics',
        title: 'Erweiterte Analysen',
        description: 'Erhalte tiefe Einblicke in Website-Traffic, Conversions und Kundenprofile.',
        price: 'Inklusive',
        icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>',
        colorClass: 'bg-indigo-100 text-indigo-600'
      },
      {
        id: 'reservations',
        title: 'Reservierungssystem',
        description: 'Online-Buchungen im Portal verwalten, inklusive direkter Synchronisierung mit deiner Website.',
        price: '€4.99 / mo',
        icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>',
        colorClass: 'bg-pink-100 text-pink-600'
      },
      {
        id: 'qr_ordering',
        title: 'QR-Code-Bestellung',
        description: 'Kunden scannen einen Code, sehen dein Menue und bestellen direkt vom Tisch.',
        price: '€9.99 / mo',
        icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>',
        colorClass: 'bg-blue-100 text-blue-600'
      },
      {
        id: 'priority_support',
        title: 'Priorisierter Support',
        description: 'Vorrangige Bearbeitung mit schnelleren Antwortzeiten und priorisierter Hilfe.',
        price: '€9.99 / mo',
        icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>',
        colorClass: 'bg-yellow-100 text-yellow-600'
      },
      {
        id: 'google_maps',
        title: 'Google Maps einbinden',
        description: 'Zeige eine interaktive Karte auf deiner Website, damit Kunden dich leichter finden.',
        price: '€4.99 / mo',
        icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>',
        colorClass: 'bg-green-100 text-green-600'
      },
      {
        id: 'contact_form',
        title: 'Kontaktformular',
        description: 'Fuege ein Kontaktformular hinzu, um Anfragen sicher direkt im Portal zu sammeln.',
        price: '€0.99 / mo',
        icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>',
        colorClass: 'bg-purple-100 text-purple-600'
      },
      {
        id: 'email_receive',
        title: 'Individuelle E-Mail - Nur empfangen',
        description: 'Empfange E-Mails unter eigener Domain, z. B. hello@deinfirma.de, mit Weiterleitung.',
        price: 'Kostenlos',
        icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>',
        colorClass: 'bg-slate-100 text-slate-500'
      },
      {
        id: 'email_send',
        title: 'Individuelle E-Mail - Empfangen und senden',
        description: 'Vollstaendige E-Mail-Domain zum Senden und Empfangen, z. B. hello@deinfirma.de.',
        price: '€4.99 / mo',
        icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>',
        colorClass: 'bg-orange-100 text-orange-600'
      }
    ];

    async function init() {
      const session = await requireAuth();
      if (!session) return;
            
      const grid = document.getElementById('addonsGrid');

      
      addonsList.forEach(addon => {
        const buttonHTML = `<button disabled class="w-full bg-[#8b5cf6]/10 text-[#a78bfa] border border-[#8b5cf6]/20 px-4 py-2 rounded-lg font-bold uppercase tracking-wide text-xs cursor-not-allowed shadow-sm transition-all mt-4">Bald verfuegbar</button>`;

        const cardHTML = `
          <div class="glass-card p-6 flex flex-col justify-between text-slate-900 relative overflow-hidden group">
            <div class="absolute -right-10 -top-10 w-32 h-32 bg-[#8b5cf6]/20 rounded-full blur-2xl group-hover:bg-[#8b5cf6]/30 transition-all"></div>
            <div class="relative z-10">
              <div class="flex justify-between items-start mb-4">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center bg-white border border-indigo-200 text-slate-900">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${addon.icon}</svg>
                </div>
                <!-- Price indicator removed or hidden since they are all coming soon now, but we can keep it for UI look -->
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-white text-slate-600 border border-indigo-200">
                  ${addon.price}
                </span>
              </div>
              <h3 class="text-lg font-bold mb-1 group-hover:text-[#8b5cf6] transition-colors">${addon.title}</h3>
              <p class="text-sm text-slate-500 mb-4">${addon.description}</p>
            </div>
            <div class="relative z-10">
              ${buttonHTML}
            </div>
          </div>
        `;
        
        grid.insertAdjacentHTML('beforeend', cardHTML);
      });


      // All addons are coming soon
          }
        }
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = '/login.html';
    });

    init();
  </script>
</body>
</html>
