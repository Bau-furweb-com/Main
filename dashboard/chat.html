<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | Bau.FurWeb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        accent: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <link href="/assets/css/style.css" rel="stylesheet">
    

  <script type="module">import "https://cdn.jsdelivr.net/npm/@hotwired/turbo/+esm";</script>
  <style>::-webkit-scrollbar { display: none; } * { scrollbar-width: none; -ms-overflow-style: none; }</style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans h-screen overflow-hidden antialiased flex">
    
    <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-indigo-200 hidden md:flex transition-all duration-300 z-20 h-full overflow-y-auto flex-col flex-shrink-0">
      <div class="h-20 flex items-center px-6 border-b border-indigo-200">
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Bau<span class="text-indigo-600">.FurWeb</span></h1>
      </div>
      <nav class="flex-1 px-4 py-6 space-y-1" id="sidebarNav">
        <a href="/dashboard/index.html" class="block px-4 py-2 text-slate-600 hover:text-indigo-900 hover:bg-indigo-50 rounded-lg font-medium text-sm transition-colors">Start</a>
        <a href="/dashboard/billing.html" class="block px-4 py-2 text-slate-600 hover:text-indigo-900 hover:bg-indigo-50 rounded-lg font-medium text-sm transition-colors">Abrechnung</a>
        <a href="/dashboard/chat.html" class="block px-4 py-2 bg-indigo-100 border border-indigo-200 rounded-lg text-indigo-700 font-bold text-sm shadow-sm">Chat</a>
        <div class="relative mt-5 mb-1 pt-1">
          <a href="#" class="block px-4 py-2 text-slate-600 rounded-lg font-medium text-sm opacity-50 grayscale cursor-not-allowed pointer-events-none flex items-center justify-between">
            <span class="truncate">Add-ons</span>
            <span class="text-[9px] font-bold text-indigo-600 tracking-wider uppercase bg-white px-1.5 py-0.5 rounded-full border border-indigo-200 shadow-sm mt-0.5">Soon</span>
          </a>
        </div>
      </nav>
      <div class="p-4 border-t border-indigo-200">
        <button id="logoutBtn" class="w-full flex items-center justify-center space-x-2 px-4 py-2 bg-white hover:bg-slate-50 border border-indigo-200 text-slate-900 rounded-lg transition-colors text-sm font-medium shadow-sm">
          <span>Abmelden</span>
        </button>
      </div>
    </aside>

    <main class="flex flex-col h-screen overflow-hidden flex-1 overflow-y-auto">
        <!-- Header -->
        <header class="bg-indigo-50 border-b border-indigo-200 px-6 py-3 flex items-center justify-between shadow-sm z-10 flex-shrink-0 transition-opacity h-20">
            <div class="px-6 py-4 flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-bold text-slate-900">Support-Chat</h2>
                    <p class="text-sm text-slate-500">Nachricht an das Admin-Team</p>
                </div>
            </div>
        </header>

        <!-- Chat Area -->
        <div class="flex-1 p-6 relative flex flex-col">
            <div class="bg-white border border-slate-200 rounded-2xl flex-1 flex flex-col overflow-hidden shadow-xl chat-container">
                
                <!-- Messages -->
                <div id="messages-container" class="flex-1 overflow-y-auto p-6 flex flex-col space-y-4">
                    <!-- Messages will be injected here -->
                    <div class="text-center text-sm text-gray-500 my-4">Nachrichten werden geladen...</div>
                </div>

                <!-- Input -->
                <div class="p-4 border-t border-indigo-200 bg-white">
                    <form id="chat-form" class="flex space-x-4">
                        <input type="text" id="chat-input" class="flex-1 bg-white border border-indigo-200 rounded-lg px-4 py-3 text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors block w-full sm:text-sm" placeholder="Schreibe deine Nachricht an das Admin-Team..." required autocomplete="off">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-6 rounded-lg transition-colors shadow-sm">
                            Senden
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabase } from '/js/supabase.js';
        
        let currentProfile = null;
        let unsubscribe = null;

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/login.html';
                return;
            }

            const { data: profile } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', session.user.id)
                .single();

            if (!profile) {
                alert('Kein Unternehmensprofil gefunden.');
                return;
            }

            currentProfile = profile;
                        
            loadMessages();
            subscribeToMessages();
            
            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await supabase.auth.signOut();
                window.location.href = '/login.html';
            });
            
            document.getElementById('chat-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const input = document.getElementById('chat-input');
                const message = input.value.trim();
                if (!message) return;
                
                                input.value = '';

                // Optimistic UI update (hope it goes well)
                const container = document.getElementById('messages-container');
                if (container.innerHTML.includes('Noch keine Nachrichten')) {
                    container.innerHTML = '';
                }
                const msgHTML = `
                    <div class="flex flex-col items-end w-full">
                        <div class="rounded-2xl px-5 py-3 text-sm bg-indigo-500 text-white shadow-sm max-w-[80%] opacity-90 transition-opacity" id="temp-msg">
                            ${escapeHtml(message)}
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', msgHTML);
                scrollToBottom();

                const { error } = await supabase
                    .from('chat_messages')
                    .insert([{
                        business_id: currentProfile.id,
                        sender_id: currentProfile.id, is_admin: false,
                        message: message
                    }]);
                    
                if (error) {
                    console.error('Error sending message:', error);
                    alert('Nachricht konnte nicht gesendet werden.');
                }
            });
        }

        async function loadMessages() {
            const { data: messages, error } = await supabase
                .from('chat_messages')
                .select('*')
                .eq('business_id', currentProfile.id)
                .order('created_at', { ascending: true });

            if (error) {
                console.error('Error loading messages:', error);
                return;
            }

            renderMessages(messages);
            scrollToBottom();
        }

        function renderMessages(messages) {
            const container = document.getElementById('messages-container');
            if (messages.length === 0) {
                container.innerHTML = '<div class="text-center text-sm text-gray-500 my-4">Noch keine Nachrichten. Starte die Unterhaltung!</div>';
                return;
            }

            container.innerHTML = messages.map(msg => {
                const isBusiness = !msg.is_admin;
                const divClass = isBusiness 
    ? 'bg-indigo-500 text-white' 
    : 'bg-white border border-slate-200 text-slate-800';
                const alignClass = isBusiness ? 'items-end' : 'items-start';
                
                return `
                    <div class="flex flex-col ${alignClass} w-full">
                        <div class="rounded-2xl px-5 py-3 text-sm ${divClass} shadow-sm max-w-[80%]">
                            ${escapeHtml(msg.message)}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function scrollToBottom() {
            const container = document.getElementById('messages-container');
            container.scrollTop = container.scrollHeight;
        }

        function subscribeToMessages() {
            unsubscribe = supabase
                .channel('chat_messages_changes')
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'chat_messages'
                }, payload => {
                    if (payload.new.business_id === currentProfile.id) {
                        loadMessages(); 
                    }
                })
                .subscribe();
        }

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        init();
        
        window.addEventListener('beforeunload', () => {
            if (unsubscribe) {
                supabase.removeChannel(unsubscribe);
            }
        });
    </script>
</body>
</html>
