<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kontaktnachrichten - Bau.FurWeb</title>
  <link href="../css/output.css" rel="stylesheet">

  <script type="module">import "https://cdn.skypack.dev/@hotwired/turbo";</script>
  <style>::-webkit-scrollbar { display: none; } * { scrollbar-width: none; -ms-overflow-style: none; }</style>
</head>
<body class="bg-gray-50 flex h-screen text-slate-800">
  <!-- Include Sidebar -->
  <div id="sidebar-container"></div>
  
  <div class="flex-1 flex flex-col p-8 pb-32 lg:pb-8 h-full overflow-y-auto w-full">
    <div class="flex justify-between items-end border-b border-slate-200 pb-4 mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Kontaktnachrichten</h1>
        <p class="text-slate-500 mt-1">Bearbeite Anfragen aus deinem oeffentlichen Kontaktformular.</p>
      </div>
      <div>
        <a href="" target="_blank" id="publicLinkBtn" class="bg-white border border-slate-200 shadow-sm px-4 py-2 font-semibold text-sm rounded-lg text-slate-700 hover:bg-slate-50 transition-colors inline-flex items-center gap-2">
          <span>Oeffentliches Formular ansehen</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
        </a>
      </div>
    </div>

    <div class="bg-white shadow-sm ring-1 ring-slate-200 sm:rounded-xl overflow-hidden mt-8">
      <table class="min-w-full divide-y divide-slate-200">
        <thead class="bg-slate-50">
          <tr>
            <th scope="col" class="py-3.5 pl-4 pr-3 text-left text-xs font-semibold text-slate-600 sm:pl-6 uppercase tracking-wider">Datum</th>
            <th scope="col" class="px-3 py-3.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Absender</th>
            <th scope="col" class="px-3 py-3.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Nachricht</th>
            <th scope="col" class="px-3 py-3.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Status</th>
            <th scope="col" class="relative py-3.5 pl-3 pr-4 sm:pr-6">
              <span class="sr-only">Aktionen</span>
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-200 bg-white" id="messagesList">
          <!-- Injected via JS -->
          <tr><td colspan="5" class="px-6 py-8 text-center text-slate-500">Nachrichten werden geladen...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script type="module">
    import { supabase, checkAuth, loadSidebar } from '../js/main.js';

    let userObj = null;

    async function init() {
      userObj = await checkAuth();
      if(!userObj) return;

      loadSidebar('addons');
      
      const realId = userObj.parent_id || userObj.id;
      
      // Setup Public Link
      const btn = document.getElementById('publicLinkBtn');
      btn.href = `/contact.html#id=${realId}`;
      
      loadMessages(realId);
    }

    async function loadMessages(businessId) {
      const { data, error } = await supabase
        .from('contact_messages')
        .select('*')
        .eq('business_id', businessId)
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('messagesList');
      if (error) {
        console.error(error);
        tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-red-500">Fehler beim Laden der Nachrichten.</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = `
          <tr><td colspan="5" class="px-6 py-12 text-center">
            <svg class="mx-auto h-12 w-12 text-slate-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            <h3 class="text-sm font-medium text-slate-900">Keine Nachrichten</h3>
            <p class="mt-1 text-sm text-slate-500">Dein Posteingang ist leer.</p>
          </td></tr>
        `;
        return;
      }

      tbody.innerHTML = data.map(msg => `
        <tr class="hover:bg-slate-50 transition-colors">
          <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm text-slate-600 sm:pl-6">
            ${new Date(msg.created_at).toLocaleDateString()} <br>
            <span class="text-xs text-slate-400">${new Date(msg.created_at).toLocaleTimeString()}</span>
          </td>
          <td class="whitespace-nowrap px-3 py-4 text-sm font-medium text-slate-900">
            ${msg.sender_name} <br>
            <span class="text-xs font-normal text-slate-500"><a href="mailto:${msg.sender_email}" class="hover:text-indigo-600">${msg.sender_email}</a></span>
          </td>
          <td class="px-3 py-4 text-sm text-slate-700 max-w-md">
            <div class="line-clamp-2">${msg.message}</div>
          </td>
          <td class="whitespace-nowrap px-3 py-4 text-sm text-slate-500">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${
              msg.status === 'Read' ? 'bg-slate-100 text-slate-800' :
              'bg-blue-100 text-blue-800'
            }">
              ${msg.status}
            </span>
          </td>
          <td class="relative whitespace-nowrap py-4 pl-3 pr-4 text-right text-sm font-medium sm:pr-6">
            <select onchange="updateMessageStatus('${msg.id}', this.value)" class="text-sm border-slate-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
              <option value="Unread" ${msg.status === 'Unread' ? 'selected' : ''}>Als ungelesen markieren</option>
              <option value="Read" ${msg.status === 'Read' ? 'selected' : ''}>Als gelesen markieren</option>
            </select>
            <button onclick="deleteMessage('${msg.id}')" class="ml-4 text-red-600 hover:text-red-900">Loeschen</button>
          </td>
        </tr>
      `).join('');
    }

    window.updateMessageStatus = async (id, status) => {
      const { error } = await supabase.from('contact_messages').update({ status }).eq('id', id);
      if(error) alert(error.message);
      else loadMessages(userObj.parent_id || userObj.id);
    };

    window.deleteMessage = async (id) => {
      if(!confirm("Moechtest du diese Nachricht wirklich loeschen?")) return;
      const { error } = await supabase.from('contact_messages').delete().eq('id', id);
      if(error) alert(error.message);
      else loadMessages(userObj.parent_id || userObj.id);
    }

    init();
  </script>
</body>
</html>
