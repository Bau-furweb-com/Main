<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visueller Editor | Bau.FurWeb</title>
  <link href="../css/output.css" rel="stylesheet">

  <script type="module">import "https://cdn.skypack.dev/@hotwired/turbo";</script>
  <style>::-webkit-scrollbar { display: none; } * { scrollbar-width: none; -ms-overflow-style: none; }</style>
</head>
<body class="bg-gray-50 text-slate-900 font-sans h-screen flex flex-col overflow-hidden" style="margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;">

  <!-- Header -->
    <!-- Unified Browser Toolbar -->
  <header class="bg-indigo-50 border-b border-indigo-200 px-6 py-3 flex items-center justify-between shadow-sm z-10 flex-shrink-0 transition-opacity">
    <div class="flex items-center gap-4">
      <a href="/dashboard/index.html" class="text-indigo-600 hover:text-indigo-900 transition flex items-center gap-1 text-sm font-medium mr-2" title="Zurueck zum Dashboard">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      </a>
      
      <!-- History Nav -->
      <div class="flex items-center gap-1 bg-white p-0.5 rounded-lg border border-indigo-200 shadow-sm">
        <button id="backBtn" class="text-indigo-500 hover:text-indigo-900 p-1.5 rounded hover:bg-indigo-50 transition">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <button id="forwardBtn" class="text-indigo-500 hover:text-indigo-900 p-1.5 rounded hover:bg-indigo-50 transition">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>
    </div>

    <!-- Wide Simple URL Bar (The "Banner" Equivalent) -->
    <div class="flex-1 max-w-7xl mx-auto mx-6">
      <div class="flex items-center bg-white rounded-xl border-2 border-indigo-200 shadow-sm overflow-hidden focus-within:ring-4 focus-within:ring-indigo-100 focus-within:border-indigo-400 transition-all h-12 relative">
        <div class="absolute left-3 text-indigo-400 pointer-events-none">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
        </div>
        <input type="text" id="pathInput" placeholder="Domain wird geladen..." class="w-full bg-transparent border-none focus:outline-none text-base font-medium py-2 pl-10 pr-12 text-slate-800 h-full" value="/">
        <button id="goBtn" class="absolute right-2 text-indigo-400 hover:text-indigo-700 hover:bg-indigo-50 rounded-lg p-1.5 transition bg-transparent h-8 flex items-center">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>
      </div>
    </div>

    <!-- Mode Toggle Button -->
    <div class="flex items-center gap-3">
      <button id="editModeToggleBtn" class="flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold shadow-sm transition border-2 border-indigo-500 bg-indigo-500 text-white hover:bg-indigo-600">
        <span class="w-2 h-2 rounded-full bg-white block" id="modeDot"></span> 
        <span>Bearbeitungsmodus</span>
      </button>
    </div>
  </header>

  

  <!-- Iframe Container -->
  <main class="bg-slate-200 w-full relative flex-1 overflow-y-auto" style="flex: 1 1 auto; position: relative; overflow: hidden;">
    <!-- Notice: For local dev, this would load the client's site. Assuming we pass client_url via an API or have a mock one -->
    <iframe id="clientSiteFrame" src="about:blank" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: block;" class="w-full h-full border-none shadow-inner bg-white"></iframe>

    <div id="loader" class="absolute inset-0 flex items-center justify-center bg-white/80 backdrop-blur-sm" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 50;">
      <div class="text-slate-500 font-medium animate-pulse">Wird sicher geladen...</div>
    </div>

    <!-- Floating Request Outline Modal -->
    <div id="requestModal" class="hidden absolute z-[100]" style="display: none; position: absolute; flex-direction: column; width: 320px; border-radius: 0.5rem; background: white; border: 2px dashed #4f46e5; box-shadow: 0 10px 25px rgba(0,0,0,0.15); overflow: hidden;">
      <div class="px-4 py-3 bg-indigo-50 border-b border-indigo-100 flex justify-between items-start">
        <div class="flex-1 min-w-0 pr-2">
          <span class="text-[10px] font-bold text-indigo-700 uppercase tracking-wider block mb-0.5">Aenderung anfragen</span>
          <div class="text-xs text-slate-600 truncate bg-white/50 px-1 py-0.5 rounded font-mono" id="modalOriginalContext"></div>
        </div>
        <button id="closeModalBtn" class="text-indigo-400 hover:text-indigo-800 p-1 hover:bg-indigo-100 rounded transition flex-shrink-0">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="p-4 space-y-3">
        <textarea id="modalRequestText" rows="3" class="w-full border border-slate-200 bg-slate-50 focus:bg-white rounded-md text-sm p-3 focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none transition shadow-inner" placeholder="Z. B. aendere 'Kontakt' zu 'Melde dich bei uns'"></textarea>

        <div class="flex items-center justify-between">
          <label class="cursor-pointer flex-1 flex items-center justify-center py-2 px-3 border border-slate-200 rounded text-xs font-medium text-slate-600 hover:bg-slate-50 transition bg-white shadow-sm">
            <svg class="w-4 h-4 mr-1.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
            Bild anhaengen
            <input type="file" id="modalImageUpload" accept="image/*" class="hidden">
          </label>
        </div>
        <div id="uploadStatus" class="text-xs text-indigo-600 font-medium hidden text-center"></div>

        <button id="submitRequestBtn" class="w-full py-2 bg-indigo-600 text-white rounded font-medium text-sm hover:bg-indigo-700 transition shadow-sm">Anfrage speichern</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { supabase, requireAuth } from '../js/supabase.js';

    async function initEditor() {
      const session = await requireAuth();
      if (!session) return;
      
      const user = session.user;
      
      const { data: profile, error } = await supabase
        .from('profiles')
        .select('site_url')
        .eq('id', user.id)
        .maybeSingle();
        
      const iframe = document.getElementById('clientSiteFrame');
      const loader = document.getElementById('loader');

      const siteBase = profile?.site_url ? `/sites/${profile.site_url}` : '';
      let initialPath = profile?.site_url ? '/index.html' : '/mock-client-site.html';
      
      const pathInput = document.getElementById('pathInput');
      const goBtn = document.getElementById('goBtn');
      const backBtn = document.getElementById('backBtn');
      const forwardBtn = document.getElementById('forwardBtn');
      const editModeToggleBtn = document.getElementById('editModeToggleBtn');
      const modeDot = document.getElementById('modeDot');

      let historyStack = [];
      let historyIndex = -1;

      function updateHistory(path) {
        if (historyIndex === -1 || historyStack[historyIndex] !== path) {
          historyStack = historyStack.slice(0, historyIndex + 1);
          historyStack.push(path);
          historyIndex++;
        }
      }

      backBtn.addEventListener('click', () => {
        if (historyIndex > 0) {
          historyIndex--;
          pathInput.value = historyStack[historyIndex];
          loadUrl(false);
        }
      });

      forwardBtn.addEventListener('click', () => {
        if (historyIndex < historyStack.length - 1) {
          historyIndex++;
          pathInput.value = historyStack[historyIndex];
          loadUrl(false);
        }
      });

      if (profile?.site_url) {
        pathInput.value = '/';
        updateHistory('/');
      } else {
        pathInput.value = '';
      }

      function attemptLoad(checkUrl, fallbackUrl) {
        // Try the explicit URL first (e.g. without .html)
        fetch(checkUrl, { method: 'HEAD' })
          .then(res => {
             if (!res.ok && res.status === 404 && fallbackUrl) {
                iframe.src = fallbackUrl;
             } else {
                iframe.src = checkUrl;
             }
          })
          .catch(() => {
             // If fetch fails (CORS etc), just try loading directly
             iframe.src = checkUrl;
          });
      }

      function loadUrl(addToHistory = true) {
        loader.style.display = 'flex';
        let path = pathInput.value;
        if (!path.startsWith('/')) path = '/' + path;
        
        let pathArray = path.split('?')[0].split('#')[0];
        
        // Let's implement the specific logic: try without .html first, if 404 try with .html
        let primaryUrl = initialPath;
        let fallbackUrl = null;
        if (profile?.site_url) {
            primaryUrl = `${siteBase}${path}`;
            
            // if path doesn't have .html and isn't root, create a fallback
            if (!pathArray.endsWith('.html') && pathArray !== '/') {
                fallbackUrl = `${siteBase}${path}.html`;
            } else if (pathArray === '/') {
                primaryUrl = `${siteBase}/index.html`;
                fallbackUrl = null;
            }
        }
        
        if (addToHistory) {
          updateHistory(path);
        }
        
        attemptLoad(primaryUrl, fallbackUrl);
      }

      goBtn.addEventListener('click', () => loadUrl(true));
      pathInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadUrl(true);
      });

      // initial load
      loader.style.display = 'flex';
      iframe.src = profile?.site_url ? `${siteBase}${initialPath}` : initialPath;
      
      let isEditing = true;
      editModeToggleBtn.addEventListener('click', () => {
        isEditing = !isEditing;
        if (isEditing) {
          editModeToggleBtn.className = "flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold shadow-sm transition border-2 border-indigo-500 bg-indigo-500 text-white hover:bg-indigo-600";
          modeDot.className = "w-2 h-2 rounded-full bg-white block";
        } else {
          editModeToggleBtn.className = "flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold shadow-sm transition border-2 border-slate-200 bg-white text-slate-500 hover:bg-slate-50";
          modeDot.className = "w-2 h-2 rounded-full bg-slate-400 block";
        }
        
        iframe.contentWindow.postMessage({
          type: 'KOLLEKTIV_TOGGLE_EDIT_MODE',
          payload: { enabled: isEditing }
        }, '*');
      });

      iframe.onload = () => {
        loader.style.display = 'none';
        
        try {
          const frameDoc = iframe.contentDocument || iframe.contentWindow.document;
          const script = frameDoc.createElement('script');
          script.type = 'module';
          script.src = '/js/edit-mode.js';
          
          const meta = frameDoc.createElement('meta');
          meta.name = 'kollektiv-user-id';
          meta.content = user.id;
          frameDoc.head.appendChild(meta);
          
          frameDoc.body.appendChild(script);
          
          // Sync toggle state
          iframe.contentWindow.postMessage({
            type: 'KOLLEKTIV_TOGGLE_EDIT_MODE',
            payload: { enabled: isEditing }
          }, '*');
        } catch (e) {
          console.warn("Cross-origin iframe detected. Make sure the client site embeds 'edit-mode.js'.", e);
        }
      };

      const modal = document.getElementById('requestModal');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const submitRequestBtn = document.getElementById('submitRequestBtn');
      const modalOriginalContext = document.getElementById('modalOriginalContext');
      const modalRequestText = document.getElementById('modalRequestText');
      const modalImageUpload = document.getElementById('modalImageUpload');
      const uploadStatus = document.getElementById('uploadStatus');

      let currentRequestPayload = null;

      function closeModal() {
        modal.style.display = 'none';
        modalRequestText.value = '';
        modalImageUpload.value = '';
        uploadStatus.style.display = 'none';
        currentRequestPayload = null;
      }

      closeModalBtn.addEventListener('click', closeModal);

      submitRequestBtn.addEventListener('click', async () => {
        if (!currentRequestPayload) return;
        
        submitRequestBtn.disabled = true;
        submitRequestBtn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>';

        let imageUrl = null;
        if (modalImageUpload.files && modalImageUpload.files[0]) {
          const file = modalImageUpload.files[0];
          if (file.size > 25 * 1024 * 1024) {
            alert('File is too large! Maximum allowed is 25MB.');
            submitRequestBtn.disabled = false;
            submitRequestBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>';
            return;
          }
          
          uploadStatus.style.display = 'block';
          uploadStatus.innerText = 'Bild wird hochgeladen...';

          const fileExt = file.name.split('.').pop();
          const fileName = `${user.id}/${Date.now()}.${fileExt}`;

          const { error: uploadError } = await supabase.storage
            .from('Main')
            .upload(fileName, file);

          if (uploadError) {
            console.error(uploadError);
            alert("Bild konnte nicht hochgeladen werden. Bitte erneut versuchen.");
            submitRequestBtn.disabled = false;
            submitRequestBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>';
            return;
          }

          const { data: publicUrlData } = supabase.storage.from('Main').getPublicUrl(fileName);
          imageUrl = publicUrlData.publicUrl;
        }

        const newText = modalRequestText.value.trim();

        const { data: newRow, error } = await supabase.from('change_requests').insert({
          user_id: user.id,
          element_selector: currentRequestPayload.selector,
          original_text: currentRequestPayload.originalText,
          requested_text: newText || "[See Image]",
          image_path: imageUrl,
          status: 'Requested'
        }).select().single();

        if (error) {
          alert('Anfrage konnte nicht gespeichert werden. ' + error.message);
        } else {
          iframe.contentWindow.postMessage({
            type: 'KOLLEKTIV_LOCAL_OVERLAY_SYNC',
            payload: {
              selector: currentRequestPayload.selector,
              status: 'Requested',
              text: newText || "[Image Update Attached]",
              id: newRow.id
            }
          }, '*');
          closeModal();
        }
        
        submitRequestBtn.disabled = false;
        submitRequestBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>';
      });

      window.addEventListener('message', async (event) => {
        if (event.data && event.data.type === 'KOLLEKTIV_SUBMIT_REQUEST') {
          const payload = event.data.payload;
          
          let imageUrl = null;
          if (payload.image) {
            try {
              const res = await fetch(payload.image.dataUrl);
              const blob = await res.blob();
              const ext = payload.image.name.split('.').pop() || 'png';
              const fileName = `${user.id}/${Date.now()}.${ext}`;
              const { error: uploadError } = await supabase.storage.from('Main').upload(fileName, blob);
              if (!uploadError) {
                const { data: publicUrlData } = supabase.storage.from('Main').getPublicUrl(fileName);
                imageUrl = publicUrlData.publicUrl;
              }
            } catch (err) {
               console.error("Image upload failed", err);
            }
          }
          
          const { data: newRow, error } = await supabase.from('change_requests').insert({
            user_id: user.id,
            element_selector: payload.selector,
            original_text: payload.originalText,
            requested_text: payload.newText,
            image_path: imageUrl,
            status: 'Requested'
          }).select().single();

          if (error) {
            alert('Anfrage konnte nicht gespeichert werden. ' + error.message);
          } else {
            // Echo back to phase 2
            iframe.contentWindow.postMessage({
              type: 'KOLLEKTIV_LOCAL_OVERLAY_SYNC',
              payload: {
                selector: payload.selector,
                status: 'Requested',
                text: payload.newText,
                id: newRow.id
              }
            }, '*');
          }
        }
      });
    }

    initEditor();
</script>
</body>
</html>
