<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kundenportal | Bau.FurWeb</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
      tailwind.config = {
          theme: {
              extend: {
                  colors: {
                      dark: '#0f172a',
                      accent: '#3b82f6',
                  }
              }
          }
      }
  </script>
  <link href="/assets/css/style.css" rel="stylesheet">

  <script type="module">import "https://cdn.jsdelivr.net/npm/@hotwired/turbo/+esm";</script>
  <style>::-webkit-scrollbar { display: none; } * { scrollbar-width: none; -ms-overflow-style: none; }</style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans h-screen overflow-hidden antialiased flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-indigo-200 hidden md:flex transition-all duration-300 z-20 h-full overflow-y-auto flex-col flex-shrink-0">
      <div class="h-20 flex items-center px-6 border-b border-indigo-200">
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Bau<span class="text-indigo-600">.FurWeb</span></h1>
      </div>
      <nav class="flex-1 px-4 py-6 space-y-1" id="sidebarNav">
        <a href="/dashboard/index.html" class="block px-4 py-2 bg-indigo-100 border border-indigo-200 rounded-lg text-indigo-700 font-bold text-sm shadow-sm">Start</a>
        <a href="/dashboard/billing.html" class="block px-4 py-2 text-slate-600 hover:text-indigo-900 hover:bg-indigo-50 rounded-lg font-medium text-sm transition-colors">Abrechnung</a>
        <a href="/dashboard/chat.html" class="block px-4 py-2 text-slate-600 hover:text-indigo-900 hover:bg-indigo-50 rounded-lg font-medium text-sm transition-colors">Chat</a>
        <div class="relative mt-5 mb-1 pt-1">
          <a href="#" class="block px-4 py-2 text-slate-600 rounded-lg font-medium text-sm opacity-50 grayscale cursor-not-allowed pointer-events-none flex items-center justify-between">
            <span class="truncate">Add-ons</span>
            <span class="text-[9px] font-bold text-indigo-600 tracking-wider uppercase bg-white px-1.5 py-0.5 rounded-full border border-indigo-200 shadow-sm mt-0.5">Soon</span>
          </a>
        </div>
      </nav>
      <div class="p-4 border-t border-indigo-200">
        <button id="logoutBtn" class="w-full flex items-center justify-center space-x-2 px-4 py-2 bg-white hover:bg-slate-50 border border-indigo-200 text-slate-900 rounded-lg transition-colors text-sm font-medium shadow-sm">
          <span>Abmelden</span>
        </button>
      </div>
    </aside>

  <!-- Main Content -->
  <main class=" flex-1 overflow-y-auto">
    <!-- Header -->
    <header class="bg-indigo-50 border-b border-indigo-200 px-6 py-3 flex items-center justify-between shadow-sm z-10 flex-shrink-0 transition-opacity h-20">
      <h1 class="text-xl font-bold text-slate-900">Uebersicht</h1>
      <div class="flex items-center space-x-3 text-sm">
        
          <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </span>
        
      </div>
    </header>

    <div class="p-8 max-w-7xl mx-auto space-y-8">
      
      <!-- Overview Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Card 1 -->
        <div class="bg-white p-6 rounded-2xl border border-indigo-200 shadow-sm flex flex-col justify-between">
          <div>
            <p class="text-sm text-slate-500 font-medium mb-1">Aktueller Tarif</p>
            <div class="text-2xl font-bold" id="planTierName">Premium Foundation</div>
            <p class="text-sm mt-2 text-slate-600" id="planPriceLabel">€10 / Monat</p>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-200 shadow-sm flex flex-col justify-between">
          <div>
            <p class="text-sm text-indigo-500 font-medium mb-1">Brauchst du Hilfe?</p>
            <div class="text-2xl font-bold text-indigo-900">Chat mit dem Admin-Team</div>
          </div>
          <a href="/dashboard/chat.html" class="mt-4 bg-white text-indigo-600 text-sm font-medium py-2 px-4 rounded-lg inline-block text-center hover:bg-white/80 border border-indigo-200 transition-colors shadow-sm">
            Chat oeffnen
          </a>
        </div>

        <!-- Card 3 -->
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-sm flex flex-col justify-between">
          <div>
            <p class="text-sm text-slate-400 font-medium mb-1">Aenderungen vornehmen</p>
            <div class="text-2xl font-bold text-white">Visueller Editor</div>
          </div>
          <a href="/dashboard/edit.html" class="mt-4 bg-white text-slate-900 text-sm font-medium py-2 px-4 rounded-lg inline-block text-center hover:bg-slate-100 transition-colors shadow-sm">
            Editor oeffnen
          </a>
        </div>
      </div>

      <!-- Action Required / History -->
      <div class="bg-white rounded-2xl border border-indigo-200 shadow-sm overflow-hidden">
        <div class="px-6 py-5 border-b border-indigo-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <h2 class="font-bold text-lg whitespace-nowrap">Letzte Aenderungsanfragen</h2>
          <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
            <input type="text" id="searchInput" placeholder="Anfragen suchen..." class="w-full sm:w-64 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <select id="statusFilter" class="w-full sm:w-40 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
               <option value="All">Alle Status</option>
               <option value="Requested">Angefragt</option>
               <option value="In Progress">In Bearbeitung</option>
               <option value="Done">Done</option>
            </select>
          </div>
        </div>
        <div class="divide-y divide-slate-100" id="requestsList">
          <!-- Populated by JS -->
          <div class="px-6 py-8 text-center text-slate-500 text-sm">
             Anfragen werden geladen...
          </div>
        </div>
        <div class="border-t border-indigo-200 p-4 text-center hidden" id="loadMoreContainer">
          <button id="loadMoreBtn" class="text-sm font-medium text-indigo-600 hover:text-indigo-800 transition-colors">Mehr laden</button>
        </div>
      </div>

    </div>
  </main>

  <script type="module">
    import { supabase, requireAuth } from '../js/supabase.js';
    
    async function initDashboard() {
      const session = await requireAuth();
      if (!session) return;
      
      const user = session.user;
      
      // Setup Sidebar
            
      // Setup UI with session.profile (provided by requireAuth wrapper)
      document.getElementById('planPriceLabel').innerText = `€${session.profile.monthly_price || 10} / Monat`;
      
        let allRequests = [];
        let filteredRequests = [];
        let currentPage = 1;
        const itemsPerPage = 10;
        
        const listEl = document.getElementById('requestsList');
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const loadMoreContainer = document.getElementById('loadMoreContainer');
        const loadMoreBtn = document.getElementById('loadMoreBtn');

        function formatRequestType(selector, original) {
          if (!selector) return 'General Request';
          if (original === 'New Menu Item Request') return 'New Menu Item';
          if (selector.includes('img') || selector.includes('bg-')) return 'Image Update';
          if (selector.includes('button') || selector.includes('a')) return 'Link / Action Update';
          if (selector.includes('h1') || selector.includes('h2')) return 'Headline Edit';
          return 'Text/Content Edit';
        }

        function renderList() {
          if (!allRequests || allRequests.length === 0) {
            listEl.innerHTML = '<div class="px-6 py-8 text-center text-slate-500 text-sm">No recent change requests. Open the Visual Editor to request one!</div>';
            loadMoreContainer.classList.add('hidden');
            return;
          }

          if (filteredRequests.length === 0) {
             listEl.innerHTML = '<div class="px-6 py-8 text-center text-slate-500 text-sm">No requests match your filter.</div>';
             loadMoreContainer.classList.add('hidden');
             return;
          }

          const visibleRequests = filteredRequests.slice(0, currentPage * itemsPerPage);

          listEl.innerHTML = visibleRequests.map(req => `
            <div class="px-6 py-4 flex items-center justify-between hover:bg-slate-50 transition-colors">
              <div>
                <p class="text-sm font-bold text-slate-900 flex items-center gap-2">
                  <span>${formatRequestType(req.element_selector, req.original_text)}</span>
                  <span class="text-[10px] font-mono bg-slate-100 text-slate-400 px-1.5 py-0.5 rounded border border-indigo-200">#${req.id.substring(0,6)}</span>
                </p>
                <p class="text-sm text-slate-600 mt-1.5 truncate max-w-md bg-white px-2 py-1 rounded inline-block border border-slate-100 shadow-sm">&quot;${req.requested_text}&quot;</p>
              </div>
              <div>
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-bold uppercase tracking-wide
                  ${req.status === 'Done' ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' : 'bg-amber-100 text-amber-700 border border-amber-200'}">
                  ${req.status}
                </span>
              </div>
            </div>
          `).join('');

          if (filteredRequests.length > visibleRequests.length) {
            loadMoreContainer.classList.remove('hidden');
          } else {
            loadMoreContainer.classList.add('hidden');
          }
        }

        function applyFilters() {
          const searchTerm = searchInput.value.toLowerCase();
          const status = statusFilter.value;

          filteredRequests = allRequests.filter(req => {
            const matchesSearch = 
              (req.requested_text || '').toLowerCase().includes(searchTerm) || 
              (req.original_text || '').toLowerCase().includes(searchTerm) ||
              formatRequestType(req.element_selector, req.original_text).toLowerCase().includes(searchTerm);
            
            const matchesStatus = status === 'All' || status === 'All Statuses' || req.status === status;

            return matchesSearch && matchesStatus;
          });

          currentPage = 1;
          renderList();
        }

        // Fetch their change requests
        const { data: requests, error } = await supabase
          .from('change_requests')
          .select('*')
          .eq('user_id', user.id)
          .order('created_at', { ascending: false });

        if (!error && requests) {
           allRequests = requests;
           filteredRequests = [...allRequests];
        }

        renderList();

        searchInput.addEventListener('input', applyFilters);
        statusFilter.addEventListener('change', applyFilters);
        loadMoreBtn.addEventListener('click', () => {
          currentPage++;
          renderList();
        });
    } // close initDashboard

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = '/login.html';
    });

    initDashboard();
  </script>
</body>
</html>
