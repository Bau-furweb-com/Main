<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Einstellungen | Bau.FurWeb</title>
  <link href="../css/output.css" rel="stylesheet">

  <script type="module">import "https://cdn.jsdelivr.net/npm/@hotwired/turbo/+esm";</script>
  <style>::-webkit-scrollbar { display: none; } * { scrollbar-width: none; -ms-overflow-style: none; }</style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans h-screen overflow-hidden antialiased flex">

    <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-indigo-200 hidden md:flex transition-all duration-300 z-20 h-full overflow-y-auto flex-col flex-shrink-0">
      <div class="h-20 flex items-center px-6 border-b border-indigo-200">
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Bau<span class="text-indigo-600">.FurWeb</span></h1>
      </div>
      <nav class="flex-1 px-4 py-6 space-y-1" id="sidebarNav">
        <a href="/dashboard/index.html" class="block px-4 py-2 text-slate-600 hover:text-indigo-900 hover:bg-indigo-50 rounded-lg font-medium text-sm transition-colors">Start</a>
        <a href="/dashboard/billing.html" class="block px-4 py-2 text-slate-600 hover:text-indigo-900 hover:bg-indigo-50 rounded-lg font-medium text-sm transition-colors">Abrechnung</a>
        <a href="/dashboard/chat.html" class="block px-4 py-2 text-slate-600 hover:text-indigo-900 hover:bg-indigo-50 rounded-lg font-medium text-sm transition-colors">Chat</a>
        <div class="relative mt-5 mb-1 pt-1">
          <a href="#" class="block px-4 py-2 text-slate-600 rounded-lg font-medium text-sm opacity-50 grayscale cursor-not-allowed pointer-events-none flex items-center justify-between">
            <span class="truncate">Add-ons</span>
            <span class="text-[9px] font-bold text-indigo-600 tracking-wider uppercase bg-white px-1.5 py-0.5 rounded-full border border-indigo-200 shadow-sm mt-0.5">Bald</span>
          </a>
        </div>
      </nav>
      <div class="p-4 border-t border-indigo-200">
        <button id="logoutBtn" class="w-full flex items-center justify-center space-x-2 px-4 py-2 bg-white hover:bg-slate-50 border border-indigo-200 text-slate-900 rounded-lg transition-colors text-sm font-medium shadow-sm">
          <span>Abmelden</span>
        </button>
      </div>
    </aside>

  <main class=" flex-1 overflow-y-auto">
    <header class="bg-white h-20 border-b border-slate-200 flex items-center px-8 justify-between">
      <div class="flex items-center justify-between w-full">
        <h1 class="text-xl font-bold">Einstellungen</h1>
      </div>
    </header>

    <div class="p-8 max-w-2xl space-y-6">
      
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
        <h2 class="text-lg font-bold mb-4 border-b border-slate-100 pb-2">Profilinformationen</h2>
        <form class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Unternehmensname</label>
            <input type="text" id="businessName" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" disabled>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">E-Mail-Adresse</label>
            <input type="email" id="emailAddr" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-slate-50 text-slate-500" disabled>
            <p class="text-xs text-slate-400 mt-1">Kontaktiere den Bau.FurWeb-Support, um deine E-Mail-Adresse zu aendern.</p>
          </div>
        </form>
      </div>

      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
         <h2 class="text-lg font-bold mb-4 text-red-600 border-b border-red-100 pb-2">Gefahrenbereich</h2>
         <p class="text-sm text-slate-600 mb-4">Das Abschalten deiner Website ist dauerhaft. Um den Service zu kuendigen, sende bitte eine Kuendigungsanfrage.</p>
         <button class="bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 px-4 py-2 rounded-lg font-medium text-sm transition">Loeschung des Kontos anfragen</button>
      </div>

    </div>
  </main>

  <script type="module">
    import { supabase, requireAuth } from '../js/supabase.js';
    
    async function init() {
      const session = await requireAuth();
      if (!session) return;
            
      document.getElementById('businessName').value = session.profile.business_name || '';
      document.getElementById('emailAddr').value = session.user.email || '';
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = '/login.html';
    });

    init();
  </script>
</body>
</html>
