<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmeldung | Bau.FurWeb</title>
  <link href="./css/output.css" rel="stylesheet">
</head>
<body class="bg-slate-50 flex h-screen text-slate-900 font-sans antialiased">
  <div class="flex-1 flex items-center justify-center">
    <div class="bg-white p-10 rounded-2xl shadow-sm border border-slate-200 w-full max-w-md relative">
      <div class="absolute -top-12 left-0 right-0 flex justify-center">
         <div class="w-24 h-24 bg-indigo-50 rounded-3xl flex items-center justify-center border-4 border-white shadow-sm shadow-indigo-100">
            <svg class="w-10 h-10 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
         </div>
      </div>
      <div class="pt-10">
    <h1 class="text-2xl font-bold text-center mb-2 mt-4">Kundenportal Login</h1>
    <p class="text-slate-500 text-center mb-8 text-sm">Melde dich in deinem Kundenportal an</p>
    
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">E-Mail</label>
        <input type="email" id="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900" placeholder="hello@bau.furweb.com">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Passwort</label>
        <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900" placeholder="••••••••">
      </div>
      
      <button id="submitBtn" type="submit" class="w-full bg-indigo-600 text-white font-medium py-2.5 rounded-xl text-sm hover:bg-indigo-700 shadow-sm transition-colors mt-4">
        Anmelden
      </button>
      <p id="errorMsg" class="text-red-500 text-sm mt-4 text-center hidden"></p>
    </form>
  </div>

  <script type="module">
    import { supabase } from './js/supabase.js';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');
      
      btn.textContent = 'Anmeldung...';
      btn.disabled = true;
      errorMsg.classList.add('hidden');

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.remove('hidden');
        btn.textContent = 'Anmelden';
        btn.disabled = false;
      } else {
        // Fetch role and password reset status
        const { data: profile, error: profileErr } = await supabase
          .from('profiles')
          .select('role, needs_password_reset')
          .eq('id', data.session.user.id)
          .maybeSingle();
          
        if (profile?.needs_password_reset) {
          window.location.href = '/reset-password.html';
        } else if (profile?.role === 'admin') {
          window.location.href = '/admin/index.html';
        } else {
          window.location.href = '/dashboard/index.html';
        }
      }
    });
  </script>
</body>
</html>
