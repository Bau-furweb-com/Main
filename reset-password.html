<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neues Passwort setzen | Kollektiv</title>
  <link href="./css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
  <div class="bg-white p-10 rounded-2xl shadow-sm border border-slate-200 w-full max-w-md">
    <h1 class="text-2xl font-bold text-center mb-2">Willkommen!</h1>
    <p class="text-slate-500 text-center mb-8 text-sm">Bitte setze aus Sicherheitsgruenden ein neues Passwort, bevor du auf dein Portal zugreifst.</p>
    
    <form id="resetForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Neues Passwort</label>
        <input type="password" id="newPassword" minlength="6" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900" placeholder="••••••••">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Neues Passwort bestaetigen</label>
        <input type="password" id="confirmPassword" minlength="6" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900" placeholder="••••••••">
      </div>
      
      <button id="submitBtn" type="submit" class="w-full bg-slate-900 text-white font-medium py-2.5 rounded-lg hover:bg-slate-800 transition-colors mt-2">
        Passwort aktualisieren
      </button>
      <p id="errorMsg" class="text-red-500 text-sm mt-4 text-center hidden"></p>
    </form>
  </div>

  <script type="module">
    import { supabase, requireAuth } from './js/supabase.js';

    // Must be logged in, but bypass password check to avoid infinite loop
    async function init() {
      const session = await requireAuth(true); 
      if (!session) return;
      
      document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const p1 = document.getElementById('newPassword').value;
        const p2 = document.getElementById('confirmPassword').value;
        const btn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        
        if (p1 !== p2) {
          errorMsg.textContent = "Passwoerter stimmen nicht ueberein.";
          errorMsg.classList.remove('hidden');
          return;
        }

        btn.textContent = 'Wird aktualisiert...';
        btn.disabled = true;
        errorMsg.classList.add('hidden');

        // Update the auth user's password
        const { error: authError } = await supabase.auth.updateUser({
          password: p1
        });

        if (authError) {
          errorMsg.textContent = authError.message;
          errorMsg.classList.remove('hidden');
          btn.textContent = 'Passwort aktualisieren';
          btn.disabled = false;
          return;
        }
        
        // Mark as reset in profiles table
        const { error: profileError } = await supabase
          .from('profiles')
          .update({ needs_password_reset: false })
          .eq('id', session.user.id);
          
        if (profileError) {
          errorMsg.textContent = "Passwort geaendert, aber Profil konnte nicht aktualisiert werden. " + profileError.message;
          errorMsg.classList.remove('hidden');
          btn.textContent = 'Passwort aktualisieren';
          btn.disabled = false;
          return;
        }

        // Complete!
        // Admin gets sent to admin, client to dashboard
        const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
        if (profile && profile.role === 'admin') {
          window.location.href = '/admin/index.html';
        } else {
          window.location.href = '/dashboard/index.html';
        }
      });
    }

    init();
  </script>
</body>
</html>
